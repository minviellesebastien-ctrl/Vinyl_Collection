<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Collection Vinyles</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app" aria-label="Collection de vinyles">

    <div class="top-clip" aria-hidden="true"></div>

    <div class="collection-count">
      <img
        src="vinyl.png"
        alt="Vinyle"
        class="vinyl-icon"
      >

      <span id="vinylCount">0</span>

      <span class="label">vinyles</span>
    </div>


    <input
      class="search-bar"
      type="search"
      placeholder="Rechercher..."
    >


    <!-- BANDEAU MIXTAPES -->

    <img
      src="mixtape.png"
      alt="Mixtapes"
      class="mixtape-banner"
    >


    <div
      id="listViewport"
      class="list-viewport"
      aria-label="Liste des vinyles"
    >

      <section
        id="vinylList"
        class="vinyl-list"
        aria-live="polite"
      ></section>

    </div>


    <div class="bottom-bar" aria-hidden="true">

      <button
        id="addButton"
        class="add-button"
        type="button"
        aria-label="Ajouter un vinyle"
      >
        <img
          src="ajout.png"
          alt=""
        >
      </button>

    </div>

  </main>


  <!-- =====================================================
       POP-UP MIXTAPE
  ====================================================== -->

  <dialog
    id="mixtapeDialog"
    class="mixtape-dialog"
  >

    <div class="mixtape-content">

      <img
        src="mur.png"
        alt=""
        class="mixtape-wall"
      >

      <textarea
        class="mixtape-text"
      ></textarea>

    </div>


    <!-- FLÈCHE SOUS LE POP-UP -->

    <button
      id="mixtapeBack"
      class="back"
      type="button"
      aria-label="Retour"
    >
      ←
    </button>

  </dialog>


  <!-- =====================================================
       POP-UP SUPPRESSION
  ====================================================== -->

  <dialog
    id="deleteDialog"
    class="vinyl-dialog"
  >

    <form method="dialog">

      <div class="dialog-head">
        <h2>Supprimer</h2>
      </div>

      <p id="deleteText"></p>

      <div class="dialog-actions">

        <button
          value="cancel"
          class="text-btn"
        >
          Annuler
        </button>

        <button
          id="confirmDelete"
          class="text-btn"
        >
          Supprimer
        </button>

      </div>

    </form>

  </dialog>


  <script src="app.js"></script>

</body>
</html>
